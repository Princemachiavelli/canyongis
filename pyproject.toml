[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "canyongis"
version = "0.1.0"
description = "Canyoneering route finder via GIS terrain analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Josh Hoffer" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "numpy",
  "scipy",
  "rasterio",
  "geopandas",
  "shapely",
  "pyproj",
  "pyogrio",
  "folium",
  "fastapi",
  "python-multipart",
  "Pillow",
  "pandas",
  "zarr",
  "uvicorn",
  # pysheds is provided by the Nix environment (built from source).
  # ML stack — also provided by the Nix flake (torch with CUDA 12.x / MPS).
  "torch>=2.2",
  "segmentation-models-pytorch",
  "albumentations",
  "scikit-image",
  "tqdm",
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[project.scripts]
canyongis = "canyongis.__main__:cli"
canyongis-validate = "canyongis.validate:cli"
canyongis-ml-train = "canyongis.ml.cli:train_cli"
canyongis-ml-predict = "canyongis.ml.cli:predict_cli"
canyongis-ml-export-features = "canyongis.ml.inspect:export_feature_pngs_cli"
canyongis-ml-export-labels = "canyongis.ml.inspect:export_canyon_labels_cli"
canyongis-ropewiki-sync = "canyongis.ingest:ingest_ropewiki_cli"
canyongis-mosaic-manifest = "canyongis.ml.manifest_mosaic:mosaic_manifest_cli"
canyongis-geomorphons = "canyongis.geomorphons:geomorphons_cli"
canyongis-geomorphon-previews = "canyongis.geomorphon_preview:geomorphon_previews_cli"
canyongis-drop-previews = "canyongis.drop_preview:drop_previews_cli"
canyongis-kml-snap = "canyongis.kml_snap:kml_snap_cli"
canyongis-drainage-previews = "canyongis.drainage_preview:drainage_previews_cli"
canyongis-ravine-compare = "canyongis.ravine_compare:ravine_compare_cli"
canyongis-ravine-spine = "canyongis.ravine_spine:ravine_spine_cli"
canyongis-web = "canyongis.web.server:cli"
canyongis-web-migrate-previews = "canyongis.web.migrate_previews:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "SIM", # flake8-simplify
  "RUF", # ruff-specific
]
ignore = [
  "E501", # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
# Greek letters (γ, α, β) in this docstring are intentional math notation
# matching the function's alpha/beta parameters; not ambiguous to a reader.
"src/canyongis/ml/losses.py" = ["RUF002"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not slow'"
markers = [
  "slow: end-to-end tests that train a model (run with `pytest -m slow` or `-m ''`)",
]
